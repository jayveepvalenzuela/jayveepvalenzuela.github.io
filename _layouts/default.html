---
layout: compress
---

<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.url }}/assets/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ site.url }}">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="{{ site.url }}/assets/img/og-image.png">

    <title>{{ site.title }}</title>

    <meta name="theme-color" content="{{ site.theme_color }}">
    <meta name="msapplication-TileColor" content="{{ site.theme_color }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="{{ site.theme_color }}">

    <link rel="preload" href="/assets/fonts/CabinetGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
    {% capture css %}@import "main";{% endcapture %}
    <style>{{ css | scssify }}</style>
    <link rel="canonical" href="{{ site.url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main id="main">
          {{ content }}
        </main>
      </div>
    </div>

    <script src="/assets/js/gsap.3.15.0.min.js" defer></script>
    <script src="/assets/js/gsap.3.15.0.scrolltrigger.min.js" defer></script>
    <script src="/assets/js/gsap.3.15.0.scrollsmoother.min.js" defer></script>
    <script src="/assets/js/main.js" defer></script>
  </body>
</html>
